apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mtdrworkshop
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
      - name: react-app
        image: %DOCKER_REGISTRY%/talos-frontend:%IMAGE_VERSION%
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---