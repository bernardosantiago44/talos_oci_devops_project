apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - port: 80
      targetPort: 8080 # Your API port
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 1
  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: %DOCKER_REGISTRY%/todolistapp-springboot:%IMAGE_VERSION%
          imagePullPolicy: Always
          env:
            - name: DB_USER
              value: "%DB_USER%"
            - name: DB_URL
              value: "%DB_URL%"
            - name: todo.table.name
              value: "todoitem"
            - name: driver_class_name
              value: "oracle.jdbc.OracleDriver"
            - name: OCI_REGION
              value: "%OCI_REGION%"
            - name: TELEGRAM_BOT_TOKEN
              value: "%TELEGRAM_BOT_TOKEN%"
            - name: TELEGRAM_BOT_NAME
              value: "%TELEGRAM_BOT_NAME%"
            - name: DB_PASSWORD
              value: "%DB_PASSWORD%"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: ALIBABA_API_KEY
              value: "%ALIBABA_API_KEY%"
            - name: dbpassword
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: true
            - name: ui_username
              value: "%UI_USERNAME%"
            - name: ui_password
              valueFrom:
                secretKeyRef:
                  name: frontendadmin
                  key: password
                  optional: true
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - containerPort: 8080
      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot
---
